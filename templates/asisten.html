<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIS Technologies AI - Desktop Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --glass: rgba(30, 41, 59, 0.7);
            --primary: #00f2fe;
            --secondary: #4facfe;
            --text: #f8fafc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background: radial-gradient(circle at top right, #1e293b, #0f172a);
            color: var(--text);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            height: 85vh;
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        header {
            padding: 24px 32px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-area h1 {
            font-size: 1.5rem;
            font-weight: 600;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-badge {
            font-size: 0.8rem;
            padding: 6px 12px;
            background: rgba(16, 185, 129, 0.1);
            color: #10b981;
            border-radius: 100px;
            border: 1px solid rgba(16, 185, 129, 0.2);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 10px #10b981;
        }

        #chat-window {
            flex: 1;
            overflow-y: auto;
            padding: 24px 32px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scrollbar-width: thin;
            scrollbar-color: var(--secondary) transparent;
        }

        .message {
            max-width: 80%;
            padding: 14px 20px;
            border-radius: 18px;
            line-height: 1.6;
            position: relative;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .user-msg {
            align-self: flex-end;
            background: linear-gradient(135deg, var(--secondary), #0061ff);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .ai-msg {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-bottom-left-radius: 4px;
        }

        .command-card {
            background: rgba(79, 172, 254, 0.1);
            border: 1px dashed var(--primary);
            padding: 15px;
            border-radius: 12px;
            margin-top: 10px;
        }

        .btn-confirm {
            margin-top: 10px;
            padding: 8px 16px;
            background: var(--primary);
            border: none;
            border-radius: 8px;
            color: var(--bg-dark);
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-confirm:hover { transform: scale(1.05); box-shadow: 0 0 15px var(--primary); }

        .input-area {
            padding: 32px;
            background: rgba(15, 23, 42, 0.5);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            gap: 16px;
        }

        input {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 14px 24px;
            border-radius: 14px;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }

        input:focus { border-color: var(--primary); background: rgba(255, 255, 255, 0.08); }

        .send-btn {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 14px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: 0.3s;
        }

        .send-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 20px -5px rgba(79, 172, 254, 0.5); }

        .typing-indicator { font-style: italic; color: #94a3b8; font-size: 0.85rem; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo-area">
                <h1>AIS TECHNOLOGIES AI</h1>
                <p style="font-size: 0.75rem; color: #94a3b8;">Expert Local Intelligence</p>
            </div>
            <div class="status-badge">
                <div class="status-dot"></div>
                Ollama Active: {{ model }}
            </div>
        </header>

        <div id="chat-window">
            <div class="message ai-msg">Halo bro! Saya adalah asisten pribadi AIS Technologies AI. Mau nyuruh apa hari ini di laptop Anda?</div>
        </div>

        <div id="typing" class="typing-indicator" style="padding: 0 32px 10px; display: none;">AI sedang berpikir...</div>

        <div class="input-area">
            <input type="text" id="user-input" placeholder="Ketik perintah di sini... (Contoh: Buka notepad)" onkeypress="handleKey(event)">
            <button class="send-btn" onclick="sendMessage()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
        </div>
    </div>

    <script>
        function handleKey(e) { if (e.key === 'Enter') sendMessage(); }

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const prompt = input.value.trim();
            if (!prompt) return;

            addMessage(prompt, 'user-msg');
            input.value = '';
            document.getElementById('typing').style.display = 'block';

            try {
                const response = await fetch('/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt })
                });
                const data = await response.json();
                document.getElementById('typing').style.display = 'none';

                if (data.status === 'success') {
                    addMessage(data.text, 'ai-msg', data.is_command ? data.command : null);
                }
            } catch (err) {
                console.error(err);
                document.getElementById('typing').style.display = 'none';
            }
        }

        function addMessage(text, className, command = null) {
            const chat = document.getElementById('chat-window');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${className}`;
            msgDiv.innerText = text;

            if (command) {
                const card = document.createElement('div');
                card.className = 'command-card';
                card.innerHTML = `<strong>PowerShell:</strong><br><code>${command}</code><br>`;
                const btn = document.createElement('button');
                btn.className = 'btn-confirm';
                btn.innerText = 'Jalankan Perintah';
                btn.onclick = () => executeCommand(command, btn);
                card.appendChild(btn);
                msgDiv.appendChild(card);
            }

            chat.appendChild(msgDiv);
            chat.scrollTop = chat.scrollHeight;
        }

        async function executeCommand(command, btn) {
            btn.innerText = 'Sedang Berjalan...';
            btn.disabled = true;
            try {
                const response = await fetch('/execute', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ command })
                });
                const data = await response.json();
                if (data.status === 'success') {
                    btn.innerText = 'Berhasil Dijalankan!';
                    btn.style.background = '#10b981';
                }
            } catch (err) {
                btn.innerText = 'Gagal!';
                btn.style.background = '#ef4444';
            }
        }
    </script>
</body>
</html>
