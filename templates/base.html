<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sukabumi Flasher SaaS{% endblock %}</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- External Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Global Core Design System & Tokens -->
    <style>
        :root {
            /* General Theme Variables */
            --bg-body: #f8fafc;
            --bg-page: #F1F5F9;
            --bg-card: #ffffff;
            --card-bg: #FFFFFF;
            --panel-bg: #F8FAFC;
            
            /* Text & Colors */
            --text-primary: #0f172a;
            --text-main: #0F172A;
            --text-secondary: #64748b;
            --text-muted: #64748B;
            --border-color: #e2e8f0;
            --border-hover: #3B82F6;
            
            /* Brand Primary & Accents */
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --primary-light: #EFF6FF;
            --accent-green: #10B981;
            --accent-green-hover: #059669;
            --accent-red: #EF4444;
            --accent-orange: #F59E0B;
            
            /* Shadows & Border Radii */
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.08), 0 2px 4px -1px rgba(0, 0, 0, 0.04);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -2px rgba(0, 0, 0, 0.04);
            --radius-sm: 6px;
            --radius: 10px;
            --radius-md: 10px;
            --radius-lg: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-primary);
            font-family: 'Plus Jakarta Sans', 'Inter', 'Poppins', sans-serif;
        }
    </style>

    {% block head %}{% endblock %}
</head>
<body>
    {% block content %}{% endblock %}
    
    {% block scripts %}{% endblock %}
</body>
</html>
