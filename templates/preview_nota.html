<!DOCTYPE html>
<html>
<head>
    <style>
        body { background-color: #e9ecef; display: flex; justify-content: center; padding: 50px; font-family: 'Segoe UI', Tahoma, sans-serif; }
        .receipt-card { background: white; width: 400px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.15); overflow: hidden; position: relative; }
        
        /* Header Biru Premium */
        .header { background: linear-gradient(135deg, #0056b3, #007bff); color: white; padding: 30px 20px; text-align: center; }
        .header h1 { margin: 0; font-size: 24px; letter-spacing: 2px; text-transform: uppercase; font-weight: 800; }
        .header .sub { margin: 5px 0; font-size: 14px; opacity: 0.9; font-weight: 300; }
        .header .wa { margin-top: 10px; font-size: 12px; background: rgba(255,255,255,0.15); display: inline-block; padding: 5px 15px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.3); }
        
        .body { padding: 30px 25px; background: white; }
        .row { display: flex; justify-content: space-between; margin-bottom: 15px; border-bottom: 1px solid #f2f2f2; padding-bottom: 10px; }
        .row:last-child { border-bottom: none; }
        .label { color: #888; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; }
        .value { color: #222; font-weight: 700; font-size: 15px; text-align: right; }
        
        .total-box { background: #fff; padding: 20px; border-radius: 15px; margin-top: 10px; text-align: center; border: 2px solid #28a745; }
        .total-box .label { font-size: 13px; color: #28a745; font-weight: 800; margin-bottom: 5px; display: block; }
        .total-box .value { font-size: 28px; color: #222; display: block; font-weight: 800; }
        
        /* Glassmorphism Footer (Bagian Kaca Transparan) */
        .footer-glass { 
            background: linear-gradient(135deg, rgba(0, 123, 255, 0.05), rgba(0, 123, 255, 0.1));
            backdrop-filter: blur(10px); /* Efek Blur Kaca */
            -webkit-backdrop-filter: blur(10px);
            padding: 30px 20px;
            text-align: center;
            border-top: 1px solid rgba(0, 123, 255, 0.1);
        }

        .stamp { 
            display: inline-block;
            border: 4px double #dc3545; /* Double line biar lebih vintage */
            color: #dc3545; 
            font-weight: 900; 
            padding: 10px 30px; 
            font-size: 22px; 
            transform: rotate(-8deg); 
            border-radius: 10px; 
            opacity: 0.9; 
            letter-spacing: 5px;
            text-transform: uppercase;
            box-shadow: 0 0 15px rgba(220, 53, 69, 0.1);
            background: rgba(255, 255, 255, 0.5); /* Biar stempel tetap pop-up di atas kaca */
        }
    </style>
</head>
<body>

<div class="receipt-card">
    <div class="header">
        <h1>SUKABUMI FLASHER</h1>
        <div class="sub">Advanced Repair iPhone & Android</div>
        <div class="wa">📞 WA: +62 811-1737-030</div>
    </div>
    
    <div class="body">
        <div class="row">
            <span class="label">Pelanggan</span>
            <span class="value">Ahmad Dani</span>
        </div>
        <div class="row">
            <span class="label">Device</span>
            <span class="value">Redmi 14</span>
        </div>
        <div class="row">
            <span class="label">Tindakan</span>
            <span class="value">Ganti IC Sinyal</span>
        </div>
        <div class="row">
            <span class="label">Garansi</span>
            <span class="value">1 Bulan (S/D 23 Mei 2026)</span>
        </div>
        
        <div class="total-box">
            <span class="label">Total Pembayaran</span>
            <span class="value">Rp 300.000</span>
        </div>
    </div>

    <div class="footer-glass">
        <div class="stamp">LUNAS</div>
    </div>
</div>

</body>
</html>
